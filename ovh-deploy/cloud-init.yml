#cloud-config
# OVH VPS-3 cloud-init — paste this in the "User data" field during VPS ordering
# Ubuntu 24.04 LTS | 8 vCPU | 24GB RAM | 200GB NVMe

package_update: true
package_upgrade: true
packages:
  - fail2ban
  - curl
  - git
  - htop
  - unattended-upgrades
  - ufw

runcmd:
  # SSH hardening
  - sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/PermitRootLogin yes/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
  - systemctl restart sshd

  # Auto security updates
  - dpkg-reconfigure --priority=low unattended-upgrades

  # Swap — 8GB on VPS-3 (24GB RAM, useful for AGE graph builds and burst workloads)
  - fallocate -l 8G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Kernel tuning for Docker + pg-boss + AGE
  - sysctl -w vm.overcommit_memory=1
  - echo 'vm.overcommit_memory=1' >> /etc/sysctl.conf
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' >> /etc/sysctl.conf

  # Firewall — allow SSH, HTTP, HTTPS, Coolify UI
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8000/tcp
  - ufw --force enable
