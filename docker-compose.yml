services:
  db:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: rorca
      POSTGRES_PASSWORD: rorca
      POSTGRES_DB: rorca
    volumes:
      - rorca_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rorca -d rorca"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rorca:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgres://rorca:rorca@db:5432/rorca
      RORCA_SERVE_STATIC: "1"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rorca_pgdata:
    driver: local
