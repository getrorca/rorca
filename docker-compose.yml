services:
  rorcha-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${RORCHA_PORT:-5210}:80"
    depends_on:
      rorcha-backend:
        condition: service_healthy
    restart: unless-stopped

  rorcha-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PORT=3030
      - DB_PATH=/data/rorcha.db
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5210}
      - SPEC_PROVIDER=${SPEC_PROVIDER:-claude}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - rorcha-data:/data
    restart: unless-stopped

volumes:
  rorcha-data:
    driver: local
