services:
  db:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: rorca
      POSTGRES_PASSWORD: rorca
      POSTGRES_DB: rorca
    volumes:
      - rorca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rorca -d rorca"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rorca:
    build:
      context: .
      dockerfile: Dockerfile
    # The image's CLI entrypoint also starts an embedded worker. Compose owns a
    # dedicated worker service below, so run only the HTTP server here.
    command: node backend/dist/server.js
    environment:
      DATABASE_URL: postgres://rorca:rorca@db:5432/rorca
      RORCA_SERVE_STATIC: "1"
      NODE_ENV: production
      RORCA_AGENT: ${RORCA_AGENT:-claude}
      RORCA_MODEL: ${RORCA_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SPEC_PROVIDER: ${SPEC_PROVIDER:-claude}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RORCA_INTERNAL_SERVICE_TOKEN: ${RORCA_INTERNAL_SERVICE_TOKEN:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.rorca.rule=Host(`${COOLIFY_FQDN}`)
      - traefik.http.routers.rorca.entrypoints=https
      - traefik.http.routers.rorca.tls=true
      - traefik.http.routers.rorca.tls.certresolver=letsencrypt
      - traefik.http.services.rorca.loadbalancer.server.port=3030

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/dist/worker.js
    environment:
      DATABASE_URL: postgres://rorca:rorca@db:5432/rorca
      NODE_ENV: production
      RORCA_AGENT: ${RORCA_AGENT:-claude}
      RORCA_MODEL: ${RORCA_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SPEC_PROVIDER: ${SPEC_PROVIDER:-claude}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RORCA_INTERNAL_SERVICE_TOKEN: ${RORCA_INTERNAL_SERVICE_TOKEN:-}
      RORCA_AUTONOMOUS_ISOLATION: linux-bwrap
      RORCA_BWRAP_BIN: /usr/bin/bwrap
      # Exact CONNECT destinations for model inference only. The autonomous
      # namespace has no direct interface/default route and cannot reach DB,
      # GitHub, localhost, or the Rorca control plane.
      RORCA_AUTONOMOUS_MODEL_EGRESS_HOSTS: ${RORCA_AUTONOMOUS_MODEL_EGRESS_HOSTS:-api.anthropic.com,api.openai.com,openrouter.ai,generativelanguage.googleapis.com}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    # The trusted worker alone receives the one capability needed to create the
    # bwrap mount/user/PID/network namespaces. Docker's default seccomp permits
    # the namespace syscalls when SYS_ADMIN is present; AppArmor must not block
    # those mount operations. The sandbox drops ALL capabilities before the
    # model command and has no host network/PID/mount view.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker.js' > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  rorca_pgdata:
    driver: local
