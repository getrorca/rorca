name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Quality gates (must pass before any binary build) ──
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Step 2: Install dependencies
      - name: Install dependencies
        run: npm ci && cd backend && npm ci

      # Step 3: Typecheck both frontend and backend
      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit

      # Step 4: Run backend tests
      - name: Run tests
        run: cd backend && npm test

      # Step 5: Build frontend
      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ── Step 6: Matrix build — 4 parallel jobs producing platform binaries ──
  build:
    name: Building ${{ matrix.name }}...
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            binary: rorca-darwin-arm64
            name: darwin-arm64
          - target: bun-darwin-x64
            binary: rorca-darwin-x64
            name: darwin-x64
          - target: bun-linux-x64
            binary: rorca-linux-x64
            name: linux-x64
          - target: bun-windows-x64
            binary: rorca-win32-x64.exe
            name: win32-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci && cd backend && npm ci

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Building ${{ matrix.name }}...
        env:
          RORCA_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-binaries.sh --target ${{ matrix.target }} --output build/${{ matrix.binary }}

      - name: Uploading assets...
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: build/${{ matrix.binary }}
          retention-days: 1

  # ── Step 9: Smoke test linux-x64 binary ──
  smoke-test:
    name: Smoke test linux-x64
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-rorca-linux-x64
          path: ./

      - name: Running smoke test...
        run: |
          chmod +x ./rorca-linux-x64
          VERSION_OUTPUT=$(./rorca-linux-x64 --version)
          echo "Binary version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "${{ github.ref_name }}"; then
            echo "Smoke test passed: version output contains ${{ github.ref_name }}"
          else
            echo "Smoke test FAILED: expected '${{ github.ref_name }}' in version output, got '$VERSION_OUTPUT'"
            exit 1
          fi

  # ── Steps 7-8: Generate release notes + create release + upload assets ──
  release:
    name: Create Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: binary-*
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Step 7: Generate release notes from git log since last tag
      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Find the previous tag; fall back to initial commit if this is the first release
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Generating notes from ${PREV_TAG}..${CURRENT_TAG}"
          {
            echo "## What's Changed"
            echo ""
            git log --oneline "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)"
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          } > release-notes.txt
          cat release-notes.txt

      # Step 8: Create GitHub Release and upload all 4 binaries as release assets
      - name: Uploading assets...
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Rorca ${{ github.ref_name }}" \
            --notes-file release-notes.txt \
            artifacts/rorca-darwin-arm64 \
            artifacts/rorca-darwin-x64 \
            artifacts/rorca-linux-x64 \
            artifacts/rorca-win32-x64.exe \
            LICENSE
