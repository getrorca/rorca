name: Wave Parallel Blocking Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RORCA_DISABLE_BACKGROUND_RUNTIME: 'true'

jobs:
  linux-qualification:
    name: Linux / Node ${{ matrix.node }} / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install exact dependencies
        run: npm ci && npm --prefix backend ci
      - name: Provision correctly owned isolated PostgreSQL 16 database
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 12)"
          RUN_ID="qrun_${TOKEN}"
          ROLE="rorca_qrole_${TOKEN}"
          DATABASE="rorca_qtest_${TOKEN}_test"
          PASSWORD="$(openssl rand -hex 24)"
          MARKER="rorca-qualification-owned:${RUN_ID}"
          APPLICATION_NAME="rorca-qualification:${RUN_ID}"
          echo "::add-mask::${PASSWORD}"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v role="$ROLE" -v password="$PASSWORD" <<'SQL'
          CREATE ROLE :"role" LOGIN PASSWORD :'password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SQL
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres --owner="$ROLE" "$DATABASE"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v database="$DATABASE" -v marker="$MARKER" <<'SQL'
          COMMENT ON DATABASE :"database" IS :'marker';
          SQL
          URL="postgresql://${ROLE}:${PASSWORD}@127.0.0.1:5432/${DATABASE}?application_name=rorca-qualification%3A${RUN_ID}"
          IDENTITY_HASH="sha256:$(printf '%s' "${DATABASE}:${ROLE}:${MARKER}" | shasum -a 256 | awk '{print $1}')"
          {
            echo "RORCA_QUALIFICATION_RUN_ID=${RUN_ID}"
            echo "RORCA_QUALIFICATION_ISOLATION_MARKER=${MARKER}"
            echo "RORCA_QUALIFICATION_DATABASE_URL=${URL}"
            echo "RORCA_QUALIFICATION_TEST_DATABASE_IDENTITY_HASH=${IDENTITY_HASH}"
            echo "RORCA_QUALIFICATION_POSTGRES_VERSION=16"
            echo "RORCA_QUALIFICATION_DATABASE_NAME=${DATABASE}"
            echo "RORCA_QUALIFICATION_ROLE_NAME=${ROLE}"
          } >> "$GITHUB_ENV"
      - name: Validate migrations on fresh isolated database
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          DATABASE_URL="$RORCA_QUALIFICATION_DATABASE_URL" RORCA_QUALIFICATION_SKIP_VECTOR_MIGRATIONS=true node_modules/.bin/tsx -e \
            "import('./src/db/pg-index.ts').then(async m => (m.runPgMigrations ?? m.default?.runPgMigrations)()).catch(error => { console.error(error); process.exit(1); })"
      - name: Run full frontend and backend suites only against the isolated test database
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run --maxWorkers=1
          cd backend
          DATABASE_URL="$RORCA_QUALIFICATION_DATABASE_URL" \
            DATABASE_URL_TEST="$RORCA_QUALIFICATION_DATABASE_URL" \
            npm test -- --runInBand
      - name: Exercise real isolation and pg-boss queue ownership boundary
        run: node scripts/run-wave-qualification.mjs backend/src/__tests__/fixtures/wave-isolation-smoke-scenario.mjs > qualification-isolation-evidence.json
      - name: Run deterministic blocking profile with diagnostic-only flaky retry
        shell: bash
        run: |
          set +e
          npm run test:wave-qualification
          FIRST=$?
          if [ "$FIRST" -ne 0 ]; then
            echo "First authoritative attempt failed; running one automatic diagnostic retry without converting the gate to success."
            npm run test:wave-qualification
            RETRY=$?
            echo "first_attempt=${FIRST} diagnostic_retry=${RETRY}" >> "$GITHUB_STEP_SUMMARY"
            exit "$FIRST"
          fi
      - name: Prove no critical platform skip exists
        run: |
          if grep -RniE '\b(test|describe)\.(skip|todo)\b|skip:[[:space:]]*true' backend/src/lib/__tests__/*wave*.test.ts; then
            echo 'Critical wave qualification skip detected without an approved equivalent-coverage record.' >&2
            exit 1
          fi
      - name: Tear down only the exact namespaced test database and role
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RORCA_QUALIFICATION_DATABASE_NAME" =~ ^rorca_qtest_[a-f0-9]{24}_test$ ]]
          [[ "$RORCA_QUALIFICATION_ROLE_NAME" =~ ^rorca_qrole_[a-f0-9]{24}$ ]]
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v database="$RORCA_QUALIFICATION_DATABASE_NAME" -v role="$RORCA_QUALIFICATION_ROLE_NAME" <<'SQL'
          DROP DATABASE :"database" WITH (FORCE);
          DROP ROLE :"role";
          SQL
          printf '{"schemaVersion":1,"namespacedTestDatabaseRemoved":true,"protectedProductionMutationCount":0}\n' > qualification-cleanup-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-qualification-linux-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            .rorca/qualification/
            .rorca/qualification-failures/
            qualification-isolation-evidence.json
            qualification-cleanup-evidence.json
          if-no-files-found: warn
          retention-days: 14

  macos-qualification:
    name: macOS / Node ${{ matrix.node }} / PostgreSQL 16
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install PostgreSQL 16 and exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          brew services start postgresql@16
          for attempt in {1..30}; do
            "$(brew --prefix postgresql@16)/bin/pg_isready" -d postgres && break
            sleep 2
          done
          "$(brew --prefix postgresql@16)/bin/pg_isready" -d postgres
          npm ci
          npm --prefix backend ci
      - name: Provision correctly owned isolated PostgreSQL 16 database
        shell: bash
        run: |
          set -euo pipefail
          PGBIN="$(brew --prefix postgresql@16)/bin"
          TOKEN="$(openssl rand -hex 12)"
          RUN_ID="qrun_${TOKEN}"
          ROLE="rorca_qrole_${TOKEN}"
          DATABASE="rorca_qtest_${TOKEN}_test"
          PASSWORD="$(openssl rand -hex 24)"
          MARKER="rorca-qualification-owned:${RUN_ID}"
          echo "::add-mask::${PASSWORD}"
          "$PGBIN/psql" -d postgres -v role="$ROLE" -v password="$PASSWORD" <<'SQL'
          CREATE ROLE :"role" LOGIN PASSWORD :'password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SQL
          "$PGBIN/createdb" --owner="$ROLE" "$DATABASE"
          "$PGBIN/psql" -d postgres -v database="$DATABASE" -v marker="$MARKER" <<'SQL'
          COMMENT ON DATABASE :"database" IS :'marker';
          SQL
          URL="postgresql://${ROLE}:${PASSWORD}@127.0.0.1:5432/${DATABASE}?application_name=rorca-qualification%3A${RUN_ID}"
          IDENTITY_HASH="sha256:$(printf '%s' "${DATABASE}:${ROLE}:${MARKER}" | shasum -a 256 | awk '{print $1}')"
          {
            echo "RORCA_QUALIFICATION_RUN_ID=${RUN_ID}"
            echo "RORCA_QUALIFICATION_ISOLATION_MARKER=${MARKER}"
            echo "RORCA_QUALIFICATION_DATABASE_URL=${URL}"
            echo "RORCA_QUALIFICATION_TEST_DATABASE_IDENTITY_HASH=${IDENTITY_HASH}"
            echo "RORCA_QUALIFICATION_POSTGRES_VERSION=16"
            echo "RORCA_QUALIFICATION_DATABASE_NAME=${DATABASE}"
            echo "RORCA_QUALIFICATION_ROLE_NAME=${ROLE}"
            echo "PATH=${PGBIN}:$PATH"
          } >> "$GITHUB_ENV"
      - name: Validate migrations on fresh isolated database
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          DATABASE_URL="$RORCA_QUALIFICATION_DATABASE_URL" RORCA_QUALIFICATION_SKIP_VECTOR_MIGRATIONS=true node_modules/.bin/tsx -e \
            "import('./src/db/pg-index.ts').then(async m => (m.runPgMigrations ?? m.default?.runPgMigrations)()).catch(error => { console.error(error); process.exit(1); })"
      - name: Run full frontend and backend suites only against the isolated test database
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run --maxWorkers=1
          cd backend
          DATABASE_URL="$RORCA_QUALIFICATION_DATABASE_URL" \
            DATABASE_URL_TEST="$RORCA_QUALIFICATION_DATABASE_URL" \
            npm test -- --runInBand
      - name: Exercise real isolation and pg-boss queue ownership boundary
        run: node scripts/run-wave-qualification.mjs backend/src/__tests__/fixtures/wave-isolation-smoke-scenario.mjs > qualification-isolation-evidence.json
      - name: Run deterministic blocking profile with diagnostic-only flaky retry
        shell: bash
        run: |
          set +e
          npm run test:wave-qualification
          FIRST=$?
          if [ "$FIRST" -ne 0 ]; then
            echo "First authoritative attempt failed; running one automatic diagnostic retry without converting the gate to success."
            npm run test:wave-qualification
            RETRY=$?
            echo "first_attempt=${FIRST} diagnostic_retry=${RETRY}" >> "$GITHUB_STEP_SUMMARY"
            exit "$FIRST"
          fi
      - name: Prove POSIX signal/process coverage is not skipped
        run: |
          if grep -RniE '\b(test|describe)\.(skip|todo)\b|skip:[[:space:]]*true' backend/src/lib/__tests__/*wave*.test.ts; then
            echo 'macOS critical signal/process qualification skip detected without equivalent coverage.' >&2
            exit 1
          fi
      - name: Tear down only the exact namespaced test database and role
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RORCA_QUALIFICATION_DATABASE_NAME" =~ ^rorca_qtest_[a-f0-9]{24}_test$ ]]
          [[ "$RORCA_QUALIFICATION_ROLE_NAME" =~ ^rorca_qrole_[a-f0-9]{24}$ ]]
          PGBIN="$(brew --prefix postgresql@16)/bin"
          "$PGBIN/psql" -d postgres -v database="$RORCA_QUALIFICATION_DATABASE_NAME" -v role="$RORCA_QUALIFICATION_ROLE_NAME" <<'SQL'
          DROP DATABASE :"database" WITH (FORCE);
          DROP ROLE :"role";
          SQL
          printf '{"schemaVersion":1,"namespacedTestDatabaseRemoved":true,"protectedProductionMutationCount":0}\n' > qualification-cleanup-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-qualification-macos-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            .rorca/qualification/
            .rorca/qualification-failures/
            qualification-isolation-evidence.json
            qualification-cleanup-evidence.json
          if-no-files-found: warn
          retention-days: 14
