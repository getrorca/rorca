<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rorca banner">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0d0d14" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#515B6B" />
      <stop offset="100%" stop-color="#232934" />
    </linearGradient>
    <clipPath id="inner-diamond">
      <rect x="132" y="132" width="248" height="248" rx="36" transform="rotate(45 256 256)" />
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bannerBg)" />
  <rect width="1200" height="320" fill="url(#glow)" />

  <g transform="translate(70 44) scale(0.48)">
    <rect x="116" y="116" width="280" height="280" rx="44" transform="rotate(45 256 256)" fill="rgba(255,255,255,0.08)" />
    <rect x="120" y="120" width="272" height="272" rx="40" transform="rotate(45 256 256)" fill="#FFFFFF" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <g clip-path="url(#inner-diamond)">
      <rect x="0" y="0" width="256" height="512" fill="url(#leftGrad)" />
      <rect x="256" y="0" width="256" height="512" fill="url(#rightGrad)" />
      <line x1="256" y1="0" x2="256" y2="512" stroke="#E5E7EB" stroke-width="12" />
      <g transform="rotate(45 256 256)">
        <rect x="224" y="156" width="124" height="60" rx="16" fill="#00E5FF" />
        <rect x="232" y="164" width="108" height="44" rx="8" fill="none" stroke="#000000" stroke-width="5" opacity="0.9" />
      </g>
    </g>
  </g>

  <text x="360" y="140" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-0.04em">Rorca</text>
  <text x="360" y="198" fill="rgba(250,250,250,0.72)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" letter-spacing="0.01em">AI spec orchestration for autonomous software development</text>
  <text x="360" y="242" fill="rgba(250,250,250,0.42)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500">Skills-first • local-first • Apache-2.0</text>
</svg>
