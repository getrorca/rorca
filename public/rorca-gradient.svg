<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#515B6B" />
      <stop offset="100%" stop-color="#232934" />
    </linearGradient>
    <clipPath id="inner-diamond">
      <rect x="132" y="132" width="248" height="248" rx="36" transform="rotate(45 256 256)" />
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#0B0F19" />

  <rect x="116" y="116" width="280" height="280" rx="44" transform="rotate(45 256 256)" fill="#FFFFFF" />

  <g clip-path="url(#inner-diamond)">
