apiVersion: v1
kind: Service
metadata:
  name: {{ include "rorca.fullname" . }}
  labels:
    {{- include "rorca.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: frontend
      port: {{ .Values.service.frontendPort }}
      targetPort: frontend
      protocol: TCP
    - name: backend
      port: {{ .Values.service.backendPort }}
      targetPort: backend
      protocol: TCP
  selector:
    {{- include "rorca.selectorLabels" . | nindent 4 }}
