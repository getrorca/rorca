name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ci-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks OSS CLI
        env:
          GITLEAKS_VERSION: v8.30.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version

      - name: Run Gitleaks
        run: export PATH="$HOME/.local/bin:$PATH"; gitleaks detect --source . --config .gitleaks.toml --redact --no-git --no-banner --verbose
