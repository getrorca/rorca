name: Binary Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'backend/**'
      - 'scripts/build-*'
      - 'scripts/smoke-test.sh'
      - 'scripts/_generate-embedded-assets.ts'
      - 'scripts/_compile-target.ts'

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Binary Smoke Test
    runs-on: ci-amd64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

  smoke-test-macos:
    name: Binary Smoke Test (macOS)
    runs-on: [macos, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run smoke test
        run: bash scripts/smoke-test.sh
