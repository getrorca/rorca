title = "Rorca Gitleaks Config"

[extend]
useDefault = true

# Allowlist policy
#
# Only *placeholder* shapes and surfaces that never ship are allowlisted. Blanket
# path skips (`\.md$`, `docs/.*`, `tests?/.*`, `fixtures?/.*`, `__tests__/.*`)
# were removed deliberately: they hid any real credential pasted into docs or a
# test file, which is the most common way a leak reaches a public repository.
# If a specific fixture must carry fake credential-shaped text, allowlist that
# exact path with a comment explaining why — never a glob over documentation.
[allowlist]
  description = "Placeholder shapes and non-published local state only"
  regexes = [
    '''PLACEHOLDER_KEY_HERE''',
    '''YOUR_[A-Z_]+_HERE''',
    '''CHANGE_ME''',
    '''REPLACE_WITH_REAL_[A-Z_]+''',
    '''sk-\\.\\.\\.''',
    '''sb_publishable_.*''',
    '''[Rr][Ee][Dd][Aa][Cc][Tt][Ee][Dd]''',
  ]
  paths = [
    # Local agent tooling state — never tracked, never published.
    '''\.pi-supervisor/.*''',
    # Env *examples* carry empty values by definition.
    '''\.env\.example$''',
    '''\.env\.local\.example$''',
    '''backend/\.env\.example$''',
    # Marketing asset directory holds screenshots, not source.
    '''packages/rorca-pi-extension/SCREENSHOT.*''',

  # Deliberate fake credential *fixtures*. These test files assert redaction and
  # detection behaviour, so they must contain credential-shaped literals
  # (``AKIAIOSFODNN7EXAMPLE``, ``ghp_...``, ``sk_live_...`` truncated forms).
  # Each path is listed explicitly — no directory glob — so any *other* file,
  # including every doc, source file and script, stays fully scanned.
    '''backend/src/__tests__/QRW\-006\-workflow\-router\-resolved\.test\.ts''',
    '''backend/src/__tests__/spec\-sanitizer\.test\.ts''',
    '''backend/src/db/__tests__/eco\-managed\-admission\.integration\.node\.test\.ts''',
    '''backend/src/db/__tests__/eco\-wired\-admission\.integration\.node\.test\.ts''',
    '''backend/src/lib/__tests__/bounty\-session\-audit\.node\.test\.ts''',
    '''backend/src/lib/__tests__/capture\-client\.test\.ts''',
    '''backend/src/lib/__tests__/context\-diff\.test\.ts''',
    '''backend/src/lib/__tests__/context\-safety\.test\.ts''',
    '''backend/src/lib/__tests__/execution\-authority\-redaction\.node\.test\.ts''',
    '''backend/src/lib/__tests__/execution\-engine\-pi\-rpc\.test\.ts''',
    # Fabricated credentials and idempotency keys asserted by tests. gitleaks'
    # generic-api-key and stripe rules match their shape, not a real secret.
    '''backend/src/lib/__tests__/stripe\-credential\-canary\.node\.test\.ts''',
    '''backend/src/lib/__tests__/run\-activity\-store\.integration\.test\.ts''',
    '''backend/src/routes/__tests__/delivery\-governance\.test\.ts''',
    '''backend/src/routes/__tests__/lifecycle\-decisions\.test\.ts''',
    '''backend/src/lib/__tests__/integration\-vault\-app\-secrets\.test\.ts''',
    '''backend/src/lib/__tests__/interactive\-pty\-agent\-adapter\.test\.ts''',
    '''backend/src/lib/__tests__/pre\-staging\-qualification\.test\.ts''',
    '''backend/src/lib/__tests__/pty\-transcript\-store\.test\.ts''',
    '''backend/src/lib/__tests__/retrieval\-trace\.test\.ts''',
    '''backend/src/lib/__tests__/source\-compiler\.node\.test\.ts''',
    '''backend/src/lib/__tests__/task\-manifest\.test\.ts''',
    '''backend/src/lib/__tests__/wave\-qualification\-evidence\.node\.test\.ts''',
    '''backend/src/routes/__tests__/context\-capture\-apis\.test\.ts''',
    '''backend/src/routes/__tests__/pipeline\-story\-result\-idempotency\.test\.ts''',
    '''packages/rorca\-capture/src/__tests__/client\-queue\.test\.ts''',
    '''packages/rorca\-pi\-extension/vscode\-extension/__tests__/client\.test\.ts''',
    '''src/api/__tests__/lifecycle\.test\.ts''',
  ]
