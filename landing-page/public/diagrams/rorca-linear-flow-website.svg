<svg width="2400" height="1350" viewBox="0 0 2400 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.45" stop-color="#111113"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="violetWash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1190 20) rotate(90) scale(520 1180)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#063A31"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 7L2 12" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 7L2 12" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #FAFAFA; }
      .muted { fill: #A1A1AA; }
      .dim { fill: #71717A; }
      .violet { fill: #C4B5FD; }
      .green { fill: #86EFAC; }
      .blue { fill: #BFDBFE; }
      .smallcaps { letter-spacing: .18em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <rect width="2400" height="1350" fill="url(#violetWash)"/>
  <path d="M0 1H2400" stroke="white" stroke-opacity="0.08"/>

  <g opacity="0.12">
    <path d="M160 0V1350M400 0V1350M640 0V1350M880 0V1350M1120 0V1350M1360 0V1350M1600 0V1350M1840 0V1350M2080 0V1350" stroke="white" stroke-opacity="0.06"/>
    <path d="M0 220H2400M0 440H2400M0 660H2400M0 880H2400M0 1100H2400" stroke="white" stroke-opacity="0.06"/>
  </g>

  <text x="1200" y="96" text-anchor="middle" class="mono title" font-size="58" font-weight="700">How Rorca Works</text>
  <text x="1200" y="142" text-anchor="middle" class="sans muted" font-size="25">One linear loop: draft a spec, approve it, run every story, then feed evidence back into context.</text>

  <!-- main panel -->
  <rect x="130" y="185" width="2140" height="1010" rx="36" fill="#111113" stroke="white" stroke-opacity="0.10" filter="url(#shadow)"/>
  <rect x="160" y="215" width="2080" height="950" rx="26" fill="#18181B" fill-opacity="0.34" stroke="white" stroke-opacity="0.06"/>

  <!-- surfaces -->
  <text x="210" y="274" class="mono smallcaps dim" font-size="16">start from any surface</text>
  <g>
    <rect x="520" y="235" width="280" height="72" rx="18" fill="#18181B" stroke="white" stroke-opacity="0.12"/>
    <rect x="830" y="235" width="280" height="72" rx="18" fill="#18181B" stroke="white" stroke-opacity="0.12"/>
    <rect x="1140" y="235" width="280" height="72" rx="18" fill="#211A32" stroke="#8B5CF6" stroke-opacity="0.52"/>
    <rect x="1450" y="235" width="280" height="72" rx="18" fill="#211A32" stroke="#8B5CF6" stroke-opacity="0.52"/>
  </g>
  <text x="660" y="265" text-anchor="middle" class="mono title" font-size="21">Dashboard</text>
  <text x="660" y="290" text-anchor="middle" class="mono dim" font-size="13">review · kanban · watch</text>
  <text x="970" y="265" text-anchor="middle" class="mono title" font-size="21">CLI / TUI</text>
  <text x="970" y="290" text-anchor="middle" class="mono dim" font-size="13">forge · run · status</text>
  <text x="1280" y="265" text-anchor="middle" class="mono violet" font-size="21">MCP tools</text>
  <text x="1280" y="290" text-anchor="middle" class="mono dim" font-size="13">stable tool contract</text>
  <text x="1590" y="265" text-anchor="middle" class="mono violet" font-size="21">Pi extension</text>
  <text x="1590" y="290" text-anchor="middle" class="mono dim" font-size="13">skills · bridge · runtime</text>
  <text x="1980" y="263" text-anchor="middle" class="sans muted" font-size="19">Many surfaces.</text>
  <text x="1980" y="290" text-anchor="middle" class="sans dim" font-size="17">One backend contract.</text>
  <path d="M520 334H1730" stroke="white" stroke-opacity="0.10" stroke-dasharray="8 12"/>

  <!-- main horizontal pipeline -->
  <text x="210" y="430" class="mono smallcaps dim" font-size="16">canonical operating path</text>
  <path d="M285 570H2055" stroke="#A78BFA" stroke-opacity="0.20" stroke-width="8" stroke-linecap="round"/>

  <!-- pipeline cards -->
  <g filter="url(#shadow)">
    <rect x="210" y="500" width="210" height="140" rx="30" fill="url(#card)" stroke="white" stroke-opacity="0.13"/>
    <rect x="500" y="490" width="260" height="160" rx="30" fill="#211A32" stroke="#8B5CF6" stroke-opacity="0.7"/>
    <rect x="850" y="455" width="300" height="230" rx="34" fill="url(#spec)" stroke="#A78BFA" stroke-opacity="0.9" filter="url(#softGlow)"/>
    <rect x="1240" y="500" width="210" height="140" rx="30" fill="url(#card)" stroke="white" stroke-opacity="0.13"/>
    <rect x="1530" y="500" width="240" height="140" rx="30" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.55"/>
    <rect x="1845" y="490" width="260" height="160" rx="30" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.55"/>
  </g>

  <text x="315" y="552" text-anchor="middle" class="mono title" font-size="26" font-weight="700">Brief</text>
  <text x="315" y="588" text-anchor="middle" class="mono muted" font-size="17">plain English</text>
  <text x="315" y="615" text-anchor="middle" class="mono dim" font-size="15">or existing PRD</text>

  <text x="630" y="535" text-anchor="middle" class="mono violet" font-size="25" font-weight="700">Skill-first forge</text>
  <text x="630" y="577" text-anchor="middle" class="mono muted" font-size="16">caller or skill drafts</text>
  <text x="630" y="603" text-anchor="middle" class="mono dim" font-size="15">Rorca validates shape</text>
  <text x="630" y="628" text-anchor="middle" class="mono dim" font-size="15">LLM fallback optional</text>

  <text x="1000" y="520" text-anchor="middle" class="mono title" font-size="31" font-weight="700">Canonical spec</text>
  <text x="1000" y="563" text-anchor="middle" class="mono blue" font-size="17">persisted source of truth</text>
  <text x="1000" y="592" text-anchor="middle" class="mono muted" font-size="15">stories · criteria · dependencies</text>
  <text x="1000" y="621" text-anchor="middle" class="mono muted" font-size="15">skills · context · annotations</text>
  <text x="1000" y="650" text-anchor="middle" class="mono dim" font-size="15">reviewable before execution</text>

  <text x="1345" y="552" text-anchor="middle" class="mono title" font-size="25" font-weight="700">Review</text>
  <text x="1345" y="586" text-anchor="middle" class="mono muted" font-size="17">approve</text>
  <text x="1345" y="613" text-anchor="middle" class="mono dim" font-size="15">edit stories safely</text>

  <text x="1650" y="546" text-anchor="middle" class="mono blue" font-size="24" font-weight="700">Queue</text>
  <text x="1650" y="581" text-anchor="middle" class="mono muted" font-size="16">pg-boss run</text>
  <text x="1650" y="607" text-anchor="middle" class="mono dim" font-size="15">story jobs</text>

  <text x="1975" y="535" text-anchor="middle" class="mono blue" font-size="24" font-weight="700">Execute</text>
  <text x="1975" y="570" text-anchor="middle" class="mono muted" font-size="15">Claude Code · OpenCode</text>
  <text x="1975" y="596" text-anchor="middle" class="mono muted" font-size="15">Codex · Pi</text>
  <text x="1975" y="623" text-anchor="middle" class="mono dim" font-size="15">native CLI tools</text>

  <!-- arrows between cards -->
  <path d="M420 570H490" stroke="#A78BFA" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M760 570H840" stroke="#A78BFA" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1150 570H1230" stroke="#A78BFA" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1450 570H1520" stroke="#A78BFA" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1770 570H1835" stroke="#A78BFA" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- context lane -->
  <text x="210" y="790" class="mono smallcaps dim" font-size="16">context retrieval before the run</text>
  <rect x="400" y="820" width="760" height="74" rx="20" fill="#08221D" stroke="#34D399" stroke-opacity="0.6"/>
  <text x="780" y="852" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Context engine</text>
  <text x="780" y="879" text-anchor="middle" class="mono muted" font-size="15">Direction Stack L1-L5 · workspace skills/personas · CAG · RAG/pgvector · Knowledge Graph</text>
  <path d="M780 820C780 760 690 730 630 650" stroke="#34D399" stroke-width="2.2" stroke-dasharray="9 10" marker-end="url(#arrowGreen)"/>
  <path d="M980 820C980 775 1000 735 1000 695" stroke="#34D399" stroke-width="2.2" stroke-dasharray="9 10" marker-end="url(#arrowGreen)"/>

  <!-- state and output lane -->
  <rect x="1280" y="808" width="430" height="96" rx="22" fill="#121214" stroke="white" stroke-opacity="0.13"/>
  <text x="1495" y="845" text-anchor="middle" class="mono title" font-size="21" font-weight="700">System of record</text>
  <text x="1495" y="874" text-anchor="middle" class="mono muted" font-size="15">Postgres · pgvector · Apache AGE · WAL · MCP audit</text>
  <path d="M1000 685C1050 755 1240 830 1270 856" stroke="#93C5FD" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1975 650C1955 730 1810 820 1720 856" stroke="#93C5FD" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1795" y="808" width="260" height="96" rx="22" fill="#08221D" stroke="#34D399" stroke-opacity="0.65"/>
  <text x="1925" y="845" text-anchor="middle" class="mono green" font-size="21" font-weight="700">Git commit / PR</text>
  <text x="1925" y="874" text-anchor="middle" class="mono muted" font-size="15">reviewable shipped work</text>
  <path d="M1975 650V798" stroke="#34D399" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

  <!-- learning lane -->
  <text x="210" y="995" class="mono smallcaps dim" font-size="16">feedback after the run</text>
  <g filter="url(#shadow)">
    <rect x="400" y="1030" width="230" height="92" rx="22" fill="url(#greenCard)" stroke="#34D399" stroke-opacity="0.62"/>
    <rect x="710" y="1030" width="245" height="92" rx="22" fill="url(#greenCard)" stroke="#34D399" stroke-opacity="0.62"/>
    <rect x="1035" y="1030" width="245" height="92" rx="22" fill="url(#greenCard)" stroke="#34D399" stroke-opacity="0.62"/>
    <rect x="1360" y="1030" width="245" height="92" rx="22" fill="url(#greenCard)" stroke="#34D399" stroke-opacity="0.62"/>
    <rect x="1685" y="1030" width="245" height="92" rx="22" fill="#071E18" stroke="#34D399" stroke-opacity="0.62"/>
  </g>
  <text x="515" y="1065" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Run evidence</text>
  <text x="515" y="1094" text-anchor="middle" class="mono dim" font-size="14">logs · diffs · outcomes</text>
  <text x="832" y="1065" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Memory synthesis</text>
  <text x="832" y="1094" text-anchor="middle" class="mono dim" font-size="14">decisions · patterns</text>
  <text x="1158" y="1065" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Knowledge graph</text>
  <text x="1158" y="1094" text-anchor="middle" class="mono dim" font-size="14">Story ↔ File ↔ Skill</text>
  <text x="1482" y="1065" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Retrieval router</text>
  <text x="1482" y="1094" text-anchor="middle" class="mono dim" font-size="14">CAG + RAG + KG</text>
  <text x="1808" y="1065" text-anchor="middle" class="mono green" font-size="20" font-weight="700">Next prompt</text>
  <text x="1808" y="1094" text-anchor="middle" class="mono dim" font-size="14">smaller · more relevant</text>

  <path d="M630 1076H700" stroke="#34D399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M955 1076H1025" stroke="#34D399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1280 1076H1350" stroke="#34D399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1605 1076H1675" stroke="#34D399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1808 1030C1720 950 1230 932 780 894" stroke="#34D399" stroke-width="2.1" stroke-dasharray="9 10" marker-end="url(#arrowGreen)"/>
  <text x="1320" y="956" text-anchor="middle" class="mono green" font-size="17">successful and failed runs both improve future context</text>

  <!-- thesis strip -->
  <rect x="245" y="1150" width="1910" height="62" rx="18" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.22"/>
  <text x="1200" y="1189" text-anchor="middle" class="sans blue" font-size="21">Rorca is the control plane: surfaces create specs, workers execute stories, and memory/graph feedback improves the next run.</text>
</svg>
