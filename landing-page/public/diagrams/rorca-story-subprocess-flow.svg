<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rorca story subprocess flow</title>
  <desc id="desc">Diagram showing a run request entering the Rorca control plane, which compiles story context and worktree state, spawns one provider CLI subprocess per story attempt, then records logs, artifacts, and status back into pipeline state.</desc>
  <rect width="1600" height="900" rx="32" fill="#0A0A0B"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="#111214" stroke="#22252B" stroke-width="2"/>

  <text x="100" y="128" fill="#F4F4F5" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="600">Story execution is isolated per attempt</text>
  <text x="100" y="170" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="24">Rorca orchestrates the run, compiles context, and hands each story attempt to the selected provider CLI as a separate subprocess.</text>

  <rect x="100" y="260" width="250" height="150" rx="24" fill="#17191D" stroke="#2A2F37" stroke-width="2"/>
  <text x="125" y="312" fill="#D4D4D8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">1 · TRIGGER</text>
  <text x="125" y="348" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Run request</text>
  <text x="125" y="382" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">Approved spec or single-story retry</text>

  <rect x="430" y="230" width="370" height="210" rx="28" fill="#0D1B1D" stroke="#2AD4C5" stroke-opacity="0.45" stroke-width="2"/>
  <text x="460" y="286" fill="#7CEBDF" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">2 · RORCA CONTROL PLANE</text>
  <text x="460" y="324" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">Compile execution packet</text>
  <text x="460" y="362" fill="#C4C9D1" font-family="Inter, Arial, sans-serif" font-size="21">Direction stack + retrieval + spec/story context</text>
  <text x="460" y="392" fill="#C4C9D1" font-family="Inter, Arial, sans-serif" font-size="21">Dependency state + worktree / branch setup</text>

  <rect x="880" y="170" width="300" height="130" rx="24" fill="#181A1F" stroke="#2A2F37" stroke-width="2"/>
  <text x="910" y="218" fill="#D4D4D8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">3A · STORY ATTEMPT</text>
  <text x="910" y="252" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">CLI subprocess #1</text>
  <text x="910" y="282" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">Claude / OpenCode / Codex / Pi</text>

  <rect x="880" y="330" width="300" height="130" rx="24" fill="#181A1F" stroke="#2A2F37" stroke-width="2"/>
  <text x="910" y="378" fill="#D4D4D8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">3B · STORY ATTEMPT</text>
  <text x="910" y="412" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">CLI subprocess #2</text>
  <text x="910" y="442" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">Retry or next dependency-safe story</text>

  <rect x="880" y="490" width="300" height="130" rx="24" fill="#181A1F" stroke="#2A2F37" stroke-width="2"/>
  <text x="910" y="538" fill="#D4D4D8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">3C · STORY ATTEMPT</text>
  <text x="910" y="572" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">CLI subprocess N</text>
  <text x="910" y="602" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">Same contract, different story context</text>

  <rect x="1260" y="260" width="240" height="360" rx="28" fill="#17191D" stroke="#2A2F37" stroke-width="2"/>
  <text x="1290" y="310" fill="#D4D4D8" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="2">4 · RORCA RECORDS</text>
  <text x="1290" y="346" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">Evidence back</text>
  <text x="1290" y="392" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">• logs and stream output</text>
  <text x="1290" y="428" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">• file/code diffs</text>
  <text x="1290" y="464" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">• exit status</text>
  <text x="1290" y="500" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">• retries / fallback</text>
  <text x="1290" y="536" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20">• story + run state</text>

  <path d="M350 335H410" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M398 323L420 335L398 347" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M800 285H850" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 273L860 285L838 297" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M800 395H850" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 383L860 395L838 407" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M800 555H850" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 543L860 555L838 567" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1180 235H1230V575H1210" stroke="#52525B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10"/>
  <path d="M1198 563L1220 575L1198 587" stroke="#52525B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="700" width="1400" height="90" rx="20" fill="#0F1115" stroke="#22252B" stroke-width="2"/>
  <text x="130" y="755" fill="#E4E4E7" font-family="Inter, Arial, sans-serif" font-size="22">Key idea:</text>
  <text x="240" y="755" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="22">Rorca is the long-lived orchestrator. The selected provider CLI does the work in isolated, story-scoped subprocesses that start, emit evidence, and exit.</text>
</svg>
