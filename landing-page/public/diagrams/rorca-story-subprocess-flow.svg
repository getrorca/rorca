<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rorca story subprocess flow</title>
  <desc id="desc">A diagram showing a run request entering the Rorca control plane, being compiled into story context, spawning provider CLI subprocesses, and returning evidence to Rorca.</desc>

  <rect width="1600" height="900" rx="32" fill="#07080A"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="#101114" stroke="#242833" stroke-width="2"/>

  <text x="100" y="125" fill="#F4F4F5" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Story execution is isolated per attempt</text>
  <text x="100" y="169" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">Rorca orchestrates the run. The selected provider CLI performs each story attempt</text>
  <text x="100" y="201" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">inside its own short-lived subprocess.</text>

  <!-- Step 1 -->
  <rect x="100" y="330" width="250" height="155" rx="24" fill="#17191D" stroke="#303641" stroke-width="2"/>
  <text x="128" y="382" fill="#C9CED6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">1 · TRIGGER</text>
  <text x="128" y="420" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Run request</text>
  <text x="128" y="456" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Approved spec</text>
  <text x="128" y="482" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">or story retry</text>

  <!-- Step 2 -->
  <rect x="430" y="285" width="360" height="245" rx="28" fill="#0B2021" stroke="#26D5C6" stroke-opacity="0.55" stroke-width="2"/>
  <text x="462" y="342" fill="#7CEBDF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">2 · RORCA CONTROL PLANE</text>
  <text x="462" y="384" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Compile packet</text>
  <text x="462" y="428" fill="#C4C9D1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• Direction stack</text>
  <text x="462" y="458" fill="#C4C9D1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• Retrieved context</text>
  <text x="462" y="488" fill="#C4C9D1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• Worktree + deps</text>

  <!-- Step 3 subprocesses -->
  <rect x="875" y="240" width="330" height="125" rx="24" fill="#181A1F" stroke="#303641" stroke-width="2"/>
  <text x="905" y="288" fill="#C9CED6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">3A · STORY ATTEMPT</text>
  <text x="905" y="324" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">CLI subprocess #1</text>
  <text x="905" y="352" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Claude / OpenCode / Codex / Pi</text>

  <rect x="875" y="395" width="330" height="125" rx="24" fill="#181A1F" stroke="#303641" stroke-width="2"/>
  <text x="905" y="443" fill="#C9CED6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">3B · STORY ATTEMPT</text>
  <text x="905" y="479" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">CLI subprocess #2</text>
  <text x="905" y="507" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Next dependency-safe story</text>

  <rect x="875" y="550" width="330" height="125" rx="24" fill="#181A1F" stroke="#303641" stroke-width="2"/>
  <text x="905" y="598" fill="#C9CED6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">3C · STORY ATTEMPT</text>
  <text x="905" y="634" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">CLI subprocess N</text>
  <text x="905" y="662" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Same contract, new context</text>

  <!-- Step 4 -->
  <rect x="1270" y="325" width="250" height="265" rx="28" fill="#17191D" stroke="#303641" stroke-width="2"/>
  <text x="1300" y="375" fill="#C9CED6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">4 · RORCA RECORDS</text>
  <text x="1300" y="413" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Evidence back</text>
  <text x="1300" y="462" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• logs</text>
  <text x="1300" y="495" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• code diffs</text>
  <text x="1300" y="528" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• exit status</text>
  <text x="1300" y="561" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">• run state</text>

  <!-- Arrows -->
  <path d="M350 407H405" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M392 394L417 407L392 420" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M790 345H845" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M832 332L857 345L832 358" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M790 458H845" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M832 445L857 458L832 471" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M790 613H845" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round"/>
  <path d="M832 600L857 613L832 626" stroke="#6EE7DA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1205 302H1240V575H1228" stroke="#52525B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10"/>
  <path d="M1214 562L1240 575L1214 588" stroke="#52525B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key idea -->
  <rect x="100" y="735" width="1420" height="92" rx="20" fill="#0F1115" stroke="#242833" stroke-width="2"/>
  <text x="130" y="782" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Key idea:</text>
  <text x="248" y="782" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Rorca keeps orchestration alive. Provider CLIs do story work in isolated subprocesses</text>
  <text x="248" y="812" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">that start, stream evidence, and exit.</text>
</svg>
