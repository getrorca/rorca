# Rorcha Log Rotation Configuration
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/rorcha
# Test: sudo logrotate -d /etc/logrotate.d/rorcha (dry run)
# Force: sudo logrotate -f /etc/logrotate.d/rorcha

# ─── Pipeline Run Logs ────────────────────────────────────────────────────────
# Located in each workspace's scripts/ralph/logs/ directory.
# These can grow large during multi-story pipeline runs (100+ stories).
/var/log/rorcha/pipeline/*.log
/data/workspaces/*/scripts/ralph/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 100M
    su root root
}

# ─── Application Logs (stdout/stderr via systemd or Docker) ──────────────────
# If running via systemd, journal handles rotation automatically.
# If logging to files (e.g., via pm2 or manual redirect), configure here.
/var/log/rorcha/app.log
/var/log/rorcha/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
    su root root
    create 0640 rorcha rorcha
}

# ─── Nginx Access and Error Logs ──────────────────────────────────────────────
# Standard nginx log rotation. Adjust paths if using Docker volumes.
/var/log/nginx/rorcha-access.log
/var/log/nginx/rorcha-error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
    endscript
}
